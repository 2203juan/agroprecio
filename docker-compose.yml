services:
  pipeline:
    build: .
    command: python main.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
