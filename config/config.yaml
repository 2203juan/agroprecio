project: agroprecio

paths:
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  models: models
  logs: logs
  database: data/gold/agroprecio.db

source:
  name: DANE - SIPSA boletín semanal de precios mayoristas
  listing_url: https://www.dane.gov.co/index.php/component/content/article/5961-sipsa-precios-mayoristas-resultado-semanal-historicos?Itemid=864&catid=203
  ajax_url: https://www.dane.gov.co/index.php?option=com_ajax&module=documentos_historicos&method=filter&format=json&dhv=134
  file_url: https://www.dane.gov.co/documentos/sipsa/DOC-{doc_id}/anexos
  max_file_mb: 5
  # Precios de cada día de mercado desde 2020, por el servicio web del SIPSA
  daily_ws_url: https://appweb.dane.gov.co/sipsaWS/SrvSipsaUpraBeanService
  # Respaldo cuando el servicio web no responde (no atiende fuera de Colombia): una copia en
  # el repositorio y el anexo en Excel de cada día que falte
  daily_seed: data/semilla/sipsa_diario.parquet
  daily_excel_url: https://www.dane.gov.co/files/operaciones/SIPSA/anex-SIPSADiario-{day}{month}{year}.xlsx

market: Cali, Cavasa

products:
  - Aguacate papelillo
  - Ahuyama
  - Cebolla cabezona blanca bogotana
  - Cebolla junca Aquitania
  - Cilantro
  - Habichuela
  - Lechuga Batavia
  - Limón Tahití
  - Lulo
  - Mango Tommy
  - Maracuyá
  - Mora de Castilla
  - Papa capira
  - Papa parda pastusa
  - Pimentón
  - Plátano hartón verde
  - Tomate chonto
  - Tomate de árbol
  - Yuca ICA
  - Zanahoria bogotana

model:
  threshold: 0.03
  # Confianza mínima para recomendar "compra ya" o "espera". Por debajo, el producto
  # queda "sin señal clara" y se compra como siempre
  min_confidence: 0.50
  test_weeks: 20
  min_history_weeks: 8
  random_state: 42

monitoring:
  drift_zscore: 3.0
  min_accuracy: 0.40

llm:
  model: claude-opus-5-5
  max_tokens: 4000

# Actualización automática desde la API (además del botón del dashboard)
update:
  auto: true
  weekday: 5   # 0 = lunes ... 5 = sábado
  hour: 8
