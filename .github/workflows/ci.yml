name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: touch .env
      - run: docker compose --profile airflow build
      - name: El DAG de Airflow carga y tiene las siete etapas en orden
        run: docker compose --profile airflow run --no-deps -v "$PWD/tests:/opt/airflow/tests:ro" airflow python /opt/airflow/tests/revisar_dag.py
